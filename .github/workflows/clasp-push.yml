name: Push to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  clasp-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push to Apps Script
        run: clasp push --force

      - name: Deploy Web App
        run: |
          clasp deploy --deploymentId AKfycbzk04KW1dxDu0gdzumgP8dRqZvJ5M0e8ef-3sJkT0jUQQJrHY3m4e2Cu73UKUvJQcUVpQ --description "GitHub Actions ${{ github.sha }}"
