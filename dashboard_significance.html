<div id="panel-sig" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">

  <h2 class="text-lg font-bold text-gray-800 mb-4">有意差</h2>

  <p class="text-sm text-gray-600 mb-4">
    ※検査開始から「1週目」のスコアと「対象週」のスコアを対応のあるt検定で比較し、p値の推移を表示しています(絞り込み・除外は一切ありません)。「低日数群」「高日数群」は、指定した期間における平均利用日数/週で分類しています。色は青: p&lt;0.01、緑: p&lt;0.05、赤: p≧0.05です。
  </p>

  <div class="flex flex-wrap items-center gap-4 text-sm font-bold text-gray-700 bg-gray-50 px-4 py-3 rounded-lg border border-gray-200 mb-4">
    <span class="text-gray-500">期間: 1〜</span>
    <input type="text" inputmode="numeric" id="sigMaxWeeks" value="12" min="2" max="104" step="1" oninput="churnNormalizeNumberInput(this); renderSigChart()" class="w-16 p-1 border border-gray-300 rounded outline-none text-center font-normal"><span class="inline-flex flex-col leading-none align-middle -ml-1 mr-1"><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, 1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 border-b-0 rounded-t-sm bg-white">&#9650;</button><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, -1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 rounded-b-sm bg-white">&#9660;</button></span>
    <span class="text-gray-500">週</span>
    <span class="text-gray-300 mx-1">|</span>
    <span id="sigPopulationCount" class="text-emerald-600"></span>

    <div class="w-full"></div>

    <span class="text-gray-500 mr-1">表示:</span>
    <label class="flex items-center gap-1 cursor-pointer">
      <input type="checkbox" id="sigShowTotal" onchange="renderSigChart()" class="w-4 h-4 cursor-pointer accent-gray-600" checked>
      <span class="text-gray-700">全体</span>
    </label>
    <label class="flex items-center gap-1 cursor-pointer">
      <input type="checkbox" id="sigShowLow" onchange="renderSigChart()" class="w-4 h-4 cursor-pointer accent-blue-600" checked>
      <span class="text-blue-600">低日数群</span>
    </label>
    <label class="flex items-center gap-1 cursor-pointer">
      <input type="checkbox" id="sigShowHigh" onchange="renderSigChart()" class="w-4 h-4 cursor-pointer accent-rose-600" checked>
      <span class="text-rose-600">高日数群</span>
    </label>

    <div class="w-full"></div>

    <span class="text-blue-600">低日数群:</span>
    <input type="text" inputmode="numeric" id="sigLowMin" value="0" min="0" max="7" step="1" oninput="churnNormalizeNumberInput(this); renderSigChart()" class="w-14 p-1 border border-gray-300 rounded outline-none text-center font-normal"><span class="inline-flex flex-col leading-none align-middle -ml-1 mr-1"><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, 1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 border-b-0 rounded-t-sm bg-white">&#9650;</button><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, -1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 rounded-b-sm bg-white">&#9660;</button></span>
    <span class="text-gray-500">〜</span>
    <input type="text" inputmode="numeric" id="sigLowMax" value="2" min="0" max="7" step="1" oninput="churnNormalizeNumberInput(this); renderSigChart()" class="w-14 p-1 border border-gray-300 rounded outline-none text-center font-normal"><span class="inline-flex flex-col leading-none align-middle -ml-1 mr-1"><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, 1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 border-b-0 rounded-t-sm bg-white">&#9650;</button><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, -1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 rounded-b-sm bg-white">&#9660;</button></span>
    <span class="text-gray-500">日</span>
    <span id="sigLowCount" class="text-gray-500 font-normal"></span>

    <span class="text-gray-300 mx-1">|</span>
    <span class="text-rose-600">高日数群:</span>
    <input type="text" inputmode="numeric" id="sigHighMin" value="4" min="0" max="7" step="1" oninput="churnNormalizeNumberInput(this); renderSigChart()" class="w-14 p-1 border border-gray-300 rounded outline-none text-center font-normal"><span class="inline-flex flex-col leading-none align-middle -ml-1 mr-1"><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, 1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 border-b-0 rounded-t-sm bg-white">&#9650;</button><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, -1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 rounded-b-sm bg-white">&#9660;</button></span>
    <span class="text-gray-500">〜</span>
    <input type="text" inputmode="numeric" id="sigHighMax" value="7" min="0" max="7" step="1" oninput="churnNormalizeNumberInput(this); renderSigChart()" class="w-14 p-1 border border-gray-300 rounded outline-none text-center font-normal"><span class="inline-flex flex-col leading-none align-middle -ml-1 mr-1"><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, 1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 border-b-0 rounded-t-sm bg-white">&#9650;</button><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, -1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 rounded-b-sm bg-white">&#9660;</button></span>
    <span class="text-gray-500">日</span>
    <span id="sigHighCount" class="text-gray-500 font-normal"></span>
  </div>

  <h4 class="text-sm font-bold text-gray-700 mb-2">1週目 → 対象週 のp値の推移</h4>
  <div class="chart-container" style="height: 320px; max-width: 900px;">
    <canvas id="sigWeeklyChart"></canvas>
  </div>
  <div id="sigWeeklyCountTable" class="overflow-x-auto mt-2" style="max-width: 900px;"></div>

</div>

<script>
  // ===== 有意差タブ: 1週目 vs 対象週のp値推移(全体・低日数群・高日数群) =====
  function getSigMaxWeeks() {
    const el = document.getElementById('sigMaxWeeks');
    return el && el.value ? Math.max(2, Math.min(104, parseInt(el.value, 10))) : 12;
  }

  function getSigRangeInput(id, fallback) {
    const el = document.getElementById(id);
    return el && el.value !== '' ? parseInt(el.value, 10) : fallback;
  }

  function getSigVisibleGroups() {
    const groups = [];
    if (document.getElementById('sigShowTotal') && document.getElementById('sigShowTotal').checked) groups.push('total');
    if (document.getElementById('sigShowLow') && document.getElementById('sigShowLow').checked) groups.push('low');
    if (document.getElementById('sigShowHigh') && document.getElementById('sigShowHigh').checked) groups.push('high');
    return groups;
  }

  // 週w(0始まり)のスコアが無い(そのユーザーがまだその週に到達していない、または未検査)場合はnullを返す
  function sigScoreAt(user, w) {
    if (!user.scores || w >= user.scores.length) return null;
    const v = user.scores[w];
    return (v === null || v === undefined) ? null : v;
  }

  // 指定した期間(1〜maxWeeks週)の平均利用日数/週を返す。その期間分のデータがまだ無いユーザーはnull
  function sigAvgDays(user, maxWeeks) {
    if (!user.data || user.data.length < maxWeeks) return null;
    let sum = 0;
    for (let w = 0; w < maxWeeks; w++) sum += (user.data[w] || 0);
    return sum / maxWeeks;
  }

  // 平均利用日数/週が[min, max]の範囲(両端含む)に該当するユーザーだけを抽出する
  function sigUsersInRange(users, maxWeeks, min, max) {
    const lo = Math.min(min, max), hi = Math.max(min, max);
    return users.filter(u => {
      const avg = sigAvgDays(u, maxWeeks);
      return avg !== null && avg >= lo && avg <= hi;
    });
  }

  // 対象週ごとに、1週目のスコアと対象週のスコアが両方そろっているユーザーだけを対象にペアを作り、
  // 対応のあるt検定のp値と対象人数を計算する
  function computeSigWeeklyPValues(users, maxWeeks) {
    const results = [];
    for (let w = 2; w <= maxWeeks; w++) {
      const diffs = [];
      users.forEach(u => {
        const first = sigScoreAt(u, 0);
        const last = sigScoreAt(u, w - 1);
        if (first === null || last === null) return;
        diffs.push(last - first);
      });
      const pValue = diffs.length > 0 ? churnPairedTTestPValue(diffs) : null;
      results.push({ week: w, pValue, n: diffs.length });
    }
    return results;
  }

  function renderSigChart() {
    try {
      if (!rawData || !rawData.usersChurn) return;
      const maxWeeks = getSigMaxWeeks();
      const lowMin = getSigRangeInput('sigLowMin', 0);
      const lowMax = getSigRangeInput('sigLowMax', 2);
      const highMin = getSigRangeInput('sigHighMin', 4);
      const highMax = getSigRangeInput('sigHighMax', 7);
      const visibleGroups = getSigVisibleGroups();

      const lowUsers = sigUsersInRange(rawData.usersChurn, maxWeeks, lowMin, lowMax);
      const highUsers = sigUsersInRange(rawData.usersChurn, maxWeeks, highMin, highMax);

      const totalCount = document.getElementById('sigPopulationCount');
      if (totalCount) totalCount.textContent = `全体: ${rawData.usersChurn.length}人`;
      const lowCountEl = document.getElementById('sigLowCount');
      if (lowCountEl) lowCountEl.textContent = `対象: ${lowUsers.length}人`;
      const highCountEl = document.getElementById('sigHighCount');
      if (highCountEl) highCountEl.textContent = `対象: ${highUsers.length}人`;

      const groupDefs = [
        { key: 'total', label: '全体', color: '#4b5563', users: rawData.usersChurn },
        { key: 'low', label: '低日数群', color: '#2563eb', users: lowUsers },
        { key: 'high', label: '高日数群', color: '#dc2626', users: highUsers }
      ];
      const weeksList = [];
      for (let w = 2; w <= maxWeeks; w++) weeksList.push(w);
      const xLabels = weeksList.map(w => `${w}週`);
      const series = groupDefs.map(g => ({
        label: g.label, color: g.color,
        values: computeSigWeeklyPValues(g.users, maxWeeks),
        hidden: !visibleGroups.includes(g.key)
      }));

      churnRenderMultiSensitivityLineChart('sigWeeklyChart', 'sigWeekly', xLabels, series, '対象週', 'sigWeeklyCountTable');
    } catch (error) {
      console.error(error);
    }
  }
</script>
