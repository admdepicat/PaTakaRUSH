<!-- ============================================== -->
<!-- パネル 6: 有意差 -->
<!-- ============================================== -->
<div id="panel-sig" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-200">

  <h2 class="text-lg font-bold text-gray-800 mb-4">有意差</h2>

  <p class="text-sm text-gray-600 mb-4">
    ※全ユーザーを対象に、検査開始から「1週目」のスコアと「対象週」のスコアを対応のあるt検定で比較し、p値の推移を表示しています(絞り込みなし、除外なし)。色は青: p&lt;0.01、緑: p&lt;0.05、赤: p≧0.05です。
  </p>

  <div class="flex flex-wrap items-center gap-4 text-sm font-bold text-gray-700 bg-gray-50 px-4 py-3 rounded-lg border border-gray-200 mb-4">
    <span class="text-gray-500">期間: 1〜</span>
    <input type="text" inputmode="numeric" id="sigMaxWeeks" value="12" min="2" max="104" step="1" oninput="churnNormalizeNumberInput(this); renderSigChart()" class="w-16 p-1 border border-gray-300 rounded outline-none text-center font-normal"><span class="inline-flex flex-col leading-none align-middle -ml-1 mr-1"><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, 1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 border-b-0 rounded-t-sm bg-white">&#9650;</button><button type="button" tabindex="-1" onclick="churnStepNumberInput(this.parentElement.previousElementSibling, -1)" class="px-1 text-[9px] leading-[9px] text-gray-500 hover:text-gray-800 border border-gray-300 rounded-b-sm bg-white">&#9660;</button></span>
    <span class="text-gray-500">週</span>
    <span class="text-gray-300 mx-1">|</span>
    <span id="sigPopulationCount" class="text-emerald-600"></span>
  </div>

  <h4 class="text-sm font-bold text-gray-700 mb-2">1週目 → 対象週 のp値の推移</h4>
  <div class="chart-container" style="height: 320px; max-width: 900px;">
    <canvas id="sigWeeklyChart"></canvas>
  </div>
  <div id="sigWeeklyCountTable" class="overflow-x-auto mt-2" style="max-width: 900px;"></div>

</div>

<script>
  // ===== 有意差タブ: 1週目 vs 対象週のp値推移(全ユーザー・絞り込みなし) =====
  function getSigMaxWeeks() {
    const el = document.getElementById('sigMaxWeeks');
    return el && el.value ? Math.max(2, Math.min(104, parseInt(el.value, 10))) : 12;
  }

  // 週w(0始まり)のスコアが無い(そのユーザーがまだその週に到達していない、または未検査)場合はnullを返す
  function sigScoreAt(user, w) {
    if (!user.scores || w >= user.scores.length) return null;
    const v = user.scores[w];
    return (v === null || v === undefined) ? null : v;
  }

  // 対象週ごとに、1週目のスコアと対象週のスコアが両方そろっているユーザーだけを対象にペアを作り、
  // 対応のあるt検定のp値と対象人数を計算する
  function computeSigWeeklyPValues(maxWeeks) {
    const results = [];
    for (let w = 2; w <= maxWeeks; w++) {
      const diffs = [];
      if (rawData && rawData.usersChurn) {
        rawData.usersChurn.forEach(u => {
          const first = sigScoreAt(u, 0);
          const last = sigScoreAt(u, w - 1);
          if (first === null || last === null) return;
          diffs.push(last - first);
        });
      }
      const pValue = diffs.length > 0 ? churnPairedTTestPValue(diffs) : null;
      results.push({ week: w, pValue, n: diffs.length });
    }
    return results;
  }

  function renderSigChart() {
    try {
      if (!rawData || !rawData.usersChurn) return;
      const maxWeeks = getSigMaxWeeks();
      const values = computeSigWeeklyPValues(maxWeeks);
      const xLabels = values.map(v => `${v.week}週`);
      const totalCount = document.getElementById('sigPopulationCount');
      if (totalCount) totalCount.textContent = `全体: ${rawData.usersChurn.length}人`;

      churnRenderMultiSensitivityLineChart(
        'sigWeeklyChart', 'sigWeekly', xLabels,
        [{ label: '1週目 → 対象週', values, color: '#4b5563' }],
        '対象週', 'sigWeeklyCountTable'
      );
    } catch (error) {
      console.error(error);
    }
  }
</script>
